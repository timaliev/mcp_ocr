[remote.github]
owner = "timaliev"
repo = "mcp_ocr"

[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}
    {%- endfor %}
{% endfor %}
"""
trim = true
