[project]
name = "mcp-ocr"
version = "1.2.0"
description = "Modular OCR MCP server with Vision, PaddleOCR, and Xiaomi-OCR-0 backends"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp[cli]>=1.9",
]

[project.optional-dependencies]
vision = ["pyobjc-framework-Vision", "pyobjc-framework-Quartz"]
paddle = ["paddleocr>=3.0", "paddlepaddle>=3.3.1"]
xiaomi = ["transformers>=5.17", "torch>=2.6", "pillow"]
all = [
    "mcp-ocr[vision,paddle,xiaomi]",
]

[project.scripts]
mcp-ocr = "mcp_ocr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_ocr"]
